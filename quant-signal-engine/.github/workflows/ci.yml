name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Formato (ruff format)
        run: ruff format --check .
      - name: Tipos (mypy)
        run: mypy src
      - name: Tests con cobertura
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml
      - name: Backtest de regresión (offline, rápido, datos sintéticos)
        run: python -m src.backtest --walk-forward --report --offline --quick
      - name: Comparar métricas vs baseline (falla si empeoran > umbral)
        run: python scripts/check_regression.py

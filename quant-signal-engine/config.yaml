# ============================================================
# quant-signal-engine — configuración principal
# Modo único permitido: PAPER TRADING (no se envían órdenes reales)
# ============================================================
project: quant-signal-engine
seed: 42

paths:
  data_dir: data            # cache local de datos (gitignored)
  cache_dir: data/cache
  signals_dir: signals
  reports_dir: reports
  models_dir: models        # modelos versionados (gitignored)

assets:
  default: ["BTC-USD", "ETH-USD", "SPY", "QQQ", "EURUSD=X"]
  crypto: ["BTC-USD", "ETH-USD"]

data:
  start: "2018-01-01"
  end: null                 # null = hoy
  max_stale_bdays: 5        # datos más viejos que esto => activo bloqueado (fail-safe)
  jump_sigma: 10.0          # |ret| > N * mediana(|ret| 60d) => alerta de salto anómalo
  cross_source_tol: 0.02    # si dos fuentes difieren > 2% en close => bloquear activo
  cache_max_age_days: 1

publication_lags:           # rezagos de publicación en días (anti look-ahead)
  fred_daily: 1
  fred_monthly: 30
  fear_greed: 1
  trends: 7
  news: 1
  derivatives: 1
  onchain: 1
  market: 1                 # VIX / DXY (cierre del día, disponible al siguiente)

costs:
  commission_bps: 5.0       # por lado de la operación
  spread_bps: 2.0
  slippage_bps: 3.0
  stress_multipliers: [1.0, 2.0, 3.0]

risk:
  mode: paper               # único modo; live está desactivado fuera de alcance
  risk_per_trade: 0.01      # 1% del capital por operación
  hard_risk_cap: 0.01
  kelly_fraction: 0.25      # máximo 1/4 de Kelly
  max_position_pct: 0.25    # tope de nocional por posición (% equity)
  min_rr: 1.5               # relación riesgo/beneficio mínima exigida
  max_drawdown: 0.15        # circuit breaker global (detiene emisión de señales)
  max_drawdown_daily: 0.05
  max_drawdown_weekly: 0.10
  max_positions: 5
  max_correlation: 0.70
  max_signals_per_day: 3
  max_consecutive_losses: 4
  target_vol_ann: 0.10      # volatilidad objetivo (baseline y dimensionamiento)
  initial_equity: 100000.0

model:
  backend: lightgbm         # lightgbm | xgboost
  threshold: 0.70           # probabilidad calibrada mínima para emitir señal
  meta_min: 0.55            # probabilidad mínima del meta-modelo
  min_agreement: 0.67       # acuerdo mínimo del ensamble (2 de 3 modelos)
  triple_barrier:
    atr_mult_tp: 3.0
    atr_mult_sl: 2.0        # => RR 1:1.5 por construcción
    max_horizon_days: 10
  walk_forward:
    train_days: 504
    embargo_days: 21        # >= max_horizon_days (purging de etiquetas)
    test_days: 63
    blind_days: 252         # test ciego final, intocable
  lgbm:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 4
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    colsample_bytree: 0.8
  calibration: isotonic     # isotonic | platt
  n_configs_tried: 1        # nº de configuraciones probadas (para Deflated Sharpe)

context_filters:
  vix_z_max: 3.0            # bloquear si VIX está > 3 desv. sobre su media 60d
  atr_z_max: 5.0            # bloquear volatilidad anómala (ATR pct z)
  volume_z_min: -2.0        # bloquear iliquidez (volumen muy bajo)
  block_events: true        # bloquear FOMC / CPI / NFP (calendars/economic.csv)
  block_event_days_before: 0
  block_event_days_after: 1
  bad_regime_winrate_min: 0.45  # si el régimen rindió peor que esto histórico, no operar

robustness:
  n_permutations: 1000      # test de permutación / señales aleatorias
  n_random_strategies: 1000
  mc_sims: 2000             # Monte Carlo (bootstrap por bloques)
  mc_block: 5
  ruin_threshold: 0.50      # ruina = equity cae bajo el 50% del inicial
  sensitivity_pct: 0.20     # ±20% en cada hiperparámetro
  stress_windows:
    - { name: "GFC 2008", start: "2008-09-01", end: "2008-12-31" }
    - { name: "COVID 2020", start: "2020-02-15", end: "2020-04-30" }
    - { name: "Subida de tasas 2022", start: "2022-01-01", end: "2022-12-31" }
    - { name: "Cripto 2018", start: "2018-01-01", end: "2018-12-31" }
    - { name: "Cripto 2022 (Luna/FTX)", start: "2022-05-01", end: "2022-11-30" }
    - { name: "Flash crash 2010", start: "2010-05-06", end: "2010-05-06" }

go_no_go:
  expectancy_x2_min: 0.0        # expectativa por operación con costos x2
  profit_factor_min: 1.3
  sharpe_oos_min: 1.0
  p_value_max: 0.05             # Deflated Sharpe vs azar
  pbo_max: 0.5
  max_dd_max: 0.15
  min_trades_oos: 100
  beats_bh_risk_adjusted: true
  paper_min_days: 90

alerts:
  telegram_token_env: TELEGRAM_TOKEN
  telegram_chat_id_env: TELEGRAM_CHAT_ID
  discord_webhook_env: DISCORD_WEBHOOK_URL
  notify_channels_env: QSE_NOTIFY_CHANNELS   # ej: "telegram,discord" (vacío = todos los configurados)
  smtp_host_env: SMTP_HOST
  smtp_port_env: SMTP_PORT
  smtp_user_env: SMTP_USER
  smtp_pass_env: SMTP_PASS
  email_from_env: EMAIL_FROM
  email_to_env: EMAIL_TO

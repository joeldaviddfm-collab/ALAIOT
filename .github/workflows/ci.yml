name: CI (quant-signal-engine)

on:
  push:
    branches: [arena/5622970a-alaiot, main]
    paths:
      - "quant-signal-engine/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [arena/5622970a-alaiot, main]
    paths:
      - "quant-signal-engine/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: quant-signal-engine

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Instalar herramientas de calidad
        run: pip install ruff mypy pytest pytest-cov
      - name: Lint (ruff)
        run: ruff check .
      - name: Formato (ruff format)
        run: ruff format --check .
      - name: Tipos (mypy)
        run: mypy src
      - name: Tests con cobertura
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml
      - name: Backtest de regresion (offline, rapido, datos sinteticos)
        run: python -m src.backtest --walk-forward --report --offline --quick
      - name: Comparar metricas vs baseline (falla si empeoran > umbral)
        run: python scripts/check_regression.py
